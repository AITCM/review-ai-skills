name: E080 N2 Independent Dense Evaluator
on:
  push:
    branches: ['data-tools/medcase-download-20261003']
    paths: ['.github/workflows/e080-n2-independent.yml']
permissions:
  contents: read
  actions: read
jobs:
  independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: data-tools/medcase-download-20261003
      - run: python3 -m pip install --quiet pandas==2.2.3 pyarrow==20.0.0 numpy==2.2.6 torch==2.7.1 sentence-transformers==5.1.1
      - name: Download immutable N2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/AITCM/review-ai-skills/actions/artifacts/11480865228/zip -o n2_artifact.zip
          sha256sum n2_artifact.zip | tee N2_ARTIFACT_SHA256.txt
      - name: Run independent dense evaluator
        shell: bash
        run: |
          set -euo pipefail
          python3 -u tools/e080_n2_independent.py 2>&1 | tee E080_N2_INDEPENDENT.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: E080-N2-Independent-Dense
          path: |
            e080-n2-independent-output/
            E080_N2_INDEPENDENT.log
            N2_ARTIFACT_SHA256.txt
          if-no-files-found: error
          retention-days: 30
