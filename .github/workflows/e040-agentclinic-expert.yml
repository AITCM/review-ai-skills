name: E040 AgentClinic NEJM Blinded Expert Pack
on:
  push:
    branches: ['data-tools/medcase-download-20261003']
    paths: ['.github/workflows/e040-agentclinic-expert.yml']
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch scripts
        run: |
          curl -fsSL https://raw.githubusercontent.com/AITCM/review-ai-skills/data-tools/medcase-download-20261003/tools/e040_prepare.py -o prepare.py
          curl -fsSL https://raw.githubusercontent.com/AITCM/review-ai-skills/data-tools/medcase-download-20261003/tools/e040_rank.py -o rank.py
          curl -fsSL https://raw.githubusercontent.com/AITCM/review-ai-skills/data-tools/medcase-download-20261003/tools/e040_pack.py -o pack.py
      - run: gh run download 37201492370 -R AITCM/review-ai-skills -n E020-T001-Locked-Test -D t001
      - run: python3 -m pip install --quiet pandas==2.2.3 pyarrow==20.0.0 numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1
      - name: Phase 0 query-only lock and near-duplicate audit
        run: python3 -u prepare.py | tee E040_prepare.log
      - name: Phase 1 frozen blind ranking
        run: python3 -u rank.py | tee E040_rank.log
      - name: Phase 2 build blinded expert packs after ranking lock
        run: python3 -u pack.py | tee E040_pack.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: E040-AgentClinic-NEJM-Blinded-Expert-Pack
          path: |
            e040/
            E040_prepare.log
            E040_rank.log
            E040_pack.log
          retention-days: 30
