name: E060B Frozen C2 CaseReportBench Structured Evidence
on:
  push:
    branches: ['data-tools/medcase-download-20261003']
    paths: ['.github/workflows/e060b-casereportbench.yml']
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch scripts
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/AITCM/review-ai-skills/data-tools/medcase-download-20261003/tools/e060b_prepare.py -o prepare.py
          curl -fsSL https://raw.githubusercontent.com/AITCM/review-ai-skills/data-tools/medcase-download-20261003/tools/e060b_rank.py -o rank.py
          curl -fsSL https://raw.githubusercontent.com/AITCM/review-ai-skills/data-tools/medcase-download-20261003/tools/e060b_eval.py -o eval.py
      - run: gh run download 37201492370 -R AITCM/review-ai-skills -n E020-T001-Locked-Test -D t001
      - run: python3 -m pip install --quiet pandas==2.2.3 pyarrow==20.0.0 numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1 torch==2.7.1 sentence-transformers==5.1.1 huggingface_hub==0.35.1
      - name: Phase 0 query-only cohort lock
        shell: bash
        run: |
          set -euo pipefail
          python3 -u prepare.py 2>&1 | tee E060B_prepare.log
          test -s e060b/E060B_QUERY_ONLY.jsonl
          test -s e060b/E060B_QUERY_LOCK.json
          test -s e060b/E060B_COHORT_LOCK.json
      - name: Phase 1 blind frozen ranking
        shell: bash
        run: |
          set -euo pipefail
          python3 -u rank.py 2>&1 | tee E060B_rank.log
          test -s e060b/E060B_RANKING_LOCK.json
          test -s e060b/E060B_BLIND_RANKINGS.jsonl
      - name: Phase 2 expert-fact evaluation after ranking lock
        shell: bash
        run: |
          set -euo pipefail
          python3 -u eval.py 2>&1 | tee E060B_eval.log
          test -s e060b/E060B_STRUCTURED_EVIDENCE_RESULTS.json
          test -s e060b/E060B_PER_CASE_SCORES.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: E060B-Frozen-C2-CaseReportBench
          path: |
            e060b/
            E060B_prepare.log
            E060B_rank.log
            E060B_eval.log
          if-no-files-found: error
          retention-days: 14
