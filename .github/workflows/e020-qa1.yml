name: E020 QA1 Near Duplicate Audit
on:
  push:
    branches: ['data-tools/medcase-download-20261003']
    paths: ['.github/workflows/e020-qa1.yml']
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - run: curl -fsSL https://raw.githubusercontent.com/AITCM/review-ai-skills/data-tools/medcase-download-20261003/tools/e020_qa1_near_duplicate.py -o qa.py
      - run: python3 -m pip install --quiet pandas==2.2.3 pyarrow==20.0.0 numpy==2.2.6 scikit-learn==1.6.1
      - name: Execute
        shell: bash
        run: |
          set -euo pipefail
          python3 -u qa.py 2>&1 | tee E020_QA1_run.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: E020-QA1-Near-Duplicate-Audit
          path: |
            e020-qa1-output/
            E020_QA1_run.log
          if-no-files-found: error
          retention-days: 7
