name: E081 N8 External Dense Robustness v2
on:
  push:
    branches:
      - data-tools/medcase-download-20261003
    paths:
      - .github/workflows/e081-dense.yml
permissions:
  contents: read
  actions: read
jobs:
  dense:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: data-tools/medcase-download-20261003
      - name: Install dependencies
        run: python3 -m pip install --quiet pandas==2.2.3 pyarrow==20.0.0 numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1 torch==2.7.1 sentence-transformers==5.1.1 huggingface_hub==0.35.1
      - name: Download frozen E081 rankings
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/AITCM/review-ai-skills/actions/artifacts/11488327277/zip" \
            -o e081_artifact.zip
      - name: Run dense evaluator
        shell: bash
        run: |
          set -euo pipefail
          python3 -u tools/e081_dense_eval.py 2>&1 | tee E081_DENSE.log
      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: E081-N8-External-Dense
          path: |
            e081-dense/
            E081_DENSE.log
          retention-days: 30
