name: E020 D5 Debiased Reasoning Utility
on:
  push:
    branches: ['data-tools/medcase-download-20261003']
    paths: ['.github/workflows/e020-d5-debiased.yml']
permissions:
  contents: read
jobs:
  d5:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - run: curl -fsSL https://raw.githubusercontent.com/AITCM/review-ai-skills/data-tools/medcase-download-20261003/tools/e020_d5_debiased.py -o d5.py
      - run: python3 -m pip install --quiet pandas==2.2.3 pyarrow==20.0.0 numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1
      - name: Execute
        shell: bash
        run: |
          set -euo pipefail
          python3 -u d5.py 2>&1 | tee D5.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: E020-D5-Debiased-Utility
          path: |
            e020-d5-output/
            D5.log
          retention-days: 7
