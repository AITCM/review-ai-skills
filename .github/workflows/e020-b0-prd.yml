name: E020 B0 Privileged Reasoning Distillation
on:
  push:
    branches: ['data-tools/medcase-download-20261003']
    paths: ['.github/workflows/e020-b0-prd.yml']
permissions:
  contents: read
jobs:
  prd:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - run: curl -fsSL https://raw.githubusercontent.com/AITCM/review-ai-skills/data-tools/medcase-download-20261003/tools/e020_b0_prd.py -o e020.py
      - run: python3 -m pip install --quiet pandas==2.2.3 pyarrow==20.0.0 numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1
      - run: python3 -u e020.py | tee E020_B0_run.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: E020-B0-Privileged-Reasoning-Distillation
          path: |
            e020-b0-output/
            E020_B0_run.log
          retention-days: 5
