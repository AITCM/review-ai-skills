name: E020 C1 Independent Reasoning Coverage
# rerun after ranking-key fix
on:
  push:
    branches: ['data-tools/medcase-download-20261003']
    paths: ['.github/workflows/e020-c1.yml']
permissions:
  contents: read
  actions: read
jobs:
  c1:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: curl -fsSL https://raw.githubusercontent.com/AITCM/review-ai-skills/data-tools/medcase-download-20261003/tools/e020_c1_reasoning_coverage.py -o e020.py
      - name: Download locked ranking artifacts
        shell: bash
        run: |
          set -euo pipefail
          gh run download 37173983037 -R AITCM/review-ai-skills -n E020-B3-Learned-Utility -D b3
          gh run download 37174104783 -R AITCM/review-ai-skills -n E020-B4-Pairwise-Hard-Negative -D b4
          gh run download 37169579765 -R AITCM/review-ai-skills -n E020-A2-S-PubMedBERT -D a2
      - run: python3 -m pip install --quiet pandas==2.2.3 pyarrow==20.0.0 numpy==2.2.6 torch==2.7.1 sentence-transformers==5.1.1 huggingface_hub==0.35.1
      - name: Execute
        shell: bash
        run: |
          set -euo pipefail
          python3 -u e020.py 2>&1 | tee E020_C1_run.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: E020-C1-Reasoning-Coverage
          path: |
            e020-c1-output/
            E020_C1_run.log
          if-no-files-found: error
          retention-days: 7
