name: E020 D10 Debiased Parameter Sensitivity
on:
  push:
    branches: ['data-tools/medcase-download-20261003']
    paths: ['.github/workflows/e020-d10.yml']
permissions:
  contents: read
jobs:
  d10:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - run: curl -fsSL https://raw.githubusercontent.com/AITCM/review-ai-skills/data-tools/medcase-download-20261003/tools/e020_d10_sensitivity.py -o x.py
      - run: python3 -m pip install --quiet pandas==2.2.3 pyarrow==20.0.0 numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1
      - run: python3 -u x.py | tee D10.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: E020-D10-Debiased-Sensitivity
          path: |
            e020-d10-output/
            D10.log
          retention-days: 7
