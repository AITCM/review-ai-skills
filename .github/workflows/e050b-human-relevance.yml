name: E050B Frozen C2 Human Relevance Validation
on:
  push:
    branches: ['data-tools/medcase-download-20261003']
    paths: ['.github/workflows/e050b-human-relevance.yml']
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch scripts
        run: |
          curl -fsSL https://raw.githubusercontent.com/AITCM/review-ai-skills/data-tools/medcase-download-20261003/tools/e050b_prepare.py -o prepare.py
          curl -fsSL https://raw.githubusercontent.com/AITCM/review-ai-skills/data-tools/medcase-download-20261003/tools/e050b_score.py -o score.py
          curl -fsSL https://raw.githubusercontent.com/AITCM/review-ai-skills/data-tools/medcase-download-20261003/tools/e050b_eval.py -o eval.py
      - run: gh run download 37257220411 -R AITCM/review-ai-skills -n E050A-PMC-Human-Mapping-Audit -D mapping
      - run: gh run download 37201492370 -R AITCM/review-ai-skills -n E020-T001-Locked-Test -D t001
      - run: python3 -m pip install --quiet pandas==2.2.3 pyarrow==20.0.0 numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1
      - name: Phase 0 label-free cohort lock
        run: python3 -u prepare.py | tee E050B_prepare.log
      - name: Phase 1 frozen blind pair scoring
        run: python3 -u score.py | tee E050B_score.log
      - name: Phase 2 load human labels after score lock
        run: python3 -u eval.py | tee E050B_eval.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: E050B-PMC-Human-Relevance-Validation
          path: |
            e050b/
            E050B_prepare.log
            E050B_score.log
            E050B_eval.log
          retention-days: 14
