name: E020 D3B Multiseed Mask Controls
on:
  push:
    branches: ['data-tools/medcase-download-20261003']
    paths: ['.github/workflows/e020-d3b-multiseed.yml']
permissions:
  contents: read
  actions: read
jobs:
  variants:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        seed: [20261004,20261005,20261006]
        mode: [none, exact, aggressive, shuffle]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - run: curl -fsSL https://raw.githubusercontent.com/AITCM/review-ai-skills/data-tools/medcase-download-20261003/tools/e020_d3b_variant.py -o run.py
      - run: python3 -m pip install --quiet pandas==2.2.3 pyarrow==20.0.0 numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1
      - run: python3 -u run.py --seed ${{ matrix.seed }} --mode ${{ matrix.mode }} --out out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d3b-${{ matrix.mode }}-${{ matrix.seed }}
          path: out/
          retention-days: 7
  aggregate:
    needs: variants
    runs-on: ubuntu-24.04
    steps:
      - run: curl -fsSL https://raw.githubusercontent.com/AITCM/review-ai-skills/data-tools/medcase-download-20261003/tools/e020_d3b_aggregate.py -o agg.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: d3b-*
          path: downloads
      - run: python3 -m pip install --quiet numpy==2.2.6
      - run: python3 -u agg.py | tee D3B.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: E020-D3B-Multiseed-Mask-Controls
          path: |
            d3b-aggregate/
            D3B.log
          retention-days: 7
