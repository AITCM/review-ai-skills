name: E020 D1 Multi Split Stability
on:
  push:
    branches: ['data-tools/medcase-download-20261003']
    paths: ['.github/workflows/e020-d1-stability.yml']
permissions:
  contents: read
  actions: read
jobs:
  stability:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed: [20261004,20261005,20261006,20261007,20261008,20261009,20261010,20261011,20261012,20261013]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - run: curl -fsSL https://raw.githubusercontent.com/AITCM/review-ai-skills/data-tools/medcase-download-20261003/tools/e020_d1_stability_seed.py -o seed.py
      - run: python3 -m pip install --quiet pandas==2.2.3 pyarrow==20.0.0 numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1
      - name: Run seed
        run: python3 -u seed.py --seed ${{ matrix.seed }} --out out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stability-${{ matrix.seed }}
          path: out/
          retention-days: 7
  aggregate:
    needs: stability
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - run: curl -fsSL https://raw.githubusercontent.com/AITCM/review-ai-skills/data-tools/medcase-download-20261003/tools/e020_d1_stability_aggregate.py -o agg.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: stability-*
          path: downloads
      - run: python3 -m pip install --quiet pandas==2.2.3 pyarrow==20.0.0 numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1
      - run: python3 -u agg.py | tee D1.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: E020-D1-Stability-Aggregate
          path: |
            stability-aggregate/
            D1.log
          retention-days: 7
