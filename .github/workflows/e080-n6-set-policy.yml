name: E080 N6 Set Aware Utility Policy
on:
  push:
    branches: ['data-tools/medcase-download-20261003']
    paths: ['.github/workflows/e080-n6-set-policy.yml']
permissions:
  contents: read
jobs:
  n6:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: data-tools/medcase-download-20261003
      - run: python3 -m pip install --quiet pandas==2.2.3 pyarrow==20.0.0 numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1
      - name: Run set-aware marginal utility policy
        shell: bash
        run: |
          set -euo pipefail
          python3 -u tools/e080_n6_set_policy.py 2>&1 | tee E080_N6.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: E080-N6-Set-Policy
          path: |
            e080-n6-output/
            E080_N6.log
          if-no-files-found: error
          retention-days: 30
