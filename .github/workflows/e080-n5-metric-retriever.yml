name: E080 N5 Direct Utility Metric Retriever
on:
  push:
    branches: ['data-tools/medcase-download-20261003']
    paths: ['.github/workflows/e080-n5-metric-retriever.yml']
permissions:
  contents: read
jobs:
  n5:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: data-tools/medcase-download-20261003
      - run: python3 -m pip install --quiet pandas==2.2.3 pyarrow==20.0.0 numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1 torch==2.7.1
      - name: Run direct utility metric retriever
        shell: bash
        run: |
          set -euo pipefail
          python3 -u tools/e080_n5_metric_retriever.py 2>&1 | tee E080_N5.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: E080-N5-Metric-Retriever
          path: |
            e080-n5-output/
            E080_N5.log
          if-no-files-found: error
          retention-days: 30
