name: MedCase R002 original 7B generation protocol check
on:
  push:
    branches: ['data-tools/medcase-download-20261003']
    paths: ['.github/workflows/medcase-original-r002.yml']
permissions:
  contents: read
jobs:
  generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - name: Fetch pinned public implementation
        run: |
          curl --fail --location --retry 2 https://raw.githubusercontent.com/AITCM/review-ai-skills/99a3911e866d6e057aff8dc0963f73b9de5597d6/tools/medcase_original_generation_r002.py -o run.py
          python3 -m py_compile run.py
      - name: Install source and Parquet readers
        run: python3 -m pip install --quiet --disable-pip-version-check pyarrow==20.0.0 pymupdf==1.26.4
      - name: Run original-model validation protocol check
        run: |
          mkdir -p r002-output
          cp run.py r002-output/RUN_SOURCE.py
          set -o pipefail
          python3 -u run.py 2>&1 | tee r002-output/run.log
      - name: Preserve outputs and explicit limitations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MedCase-original-R002-7B-generation
          path: r002-output/
          retention-days: 2
          if-no-files-found: error
          compression-level: 6
