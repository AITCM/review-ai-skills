name: E020 D5F Verbosity Bias Audit
on:
  push:
    branches: ['data-tools/medcase-download-20261003']
    paths: ['.github/workflows/e020-d5f.yml']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: curl -fsSL https://raw.githubusercontent.com/AITCM/review-ai-skills/data-tools/medcase-download-20261003/tools/e020_d5f_verbosity.py -o run.py
      - run: gh run download 37201150183 -R AITCM/review-ai-skills -p 'd5c-*' -D downloads
      - run: python3 -m pip install --quiet pandas==2.2.3 pyarrow==20.0.0 numpy==2.2.6 scipy==1.15.3
      - run: python3 -u run.py | tee D5F.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: E020-D5F-Verbosity-Bias-Audit
          path: |
            d5f-output/
            D5F.log
          retention-days: 7
