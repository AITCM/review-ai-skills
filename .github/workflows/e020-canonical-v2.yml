name: E020 Canonical V2
on:
  push:
    branches: ['data-tools/medcase-download-20261003']
    paths: ['.github/workflows/e020-canonical-v2.yml']
permissions:
  contents: read
jobs:
  canonical:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - run: curl -fsSL https://raw.githubusercontent.com/AITCM/review-ai-skills/data-tools/medcase-download-20261003/tools/e020_canonical_and_masked_v2.py -o e020.py
      - run: python3 -m pip install --quiet pandas==2.2.3 pyarrow==20.0.0 numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1 rank_bm25==0.2.2
      - name: Execute with pipefail
        shell: bash
        run: |
          set -euo pipefail
          python3 -u e020.py 2>&1 | tee E020_CANONICAL_V2_run.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: E020-Canonical-V2
          path: |
            e020-canonical-v2-output/
            E020_CANONICAL_V2_run.log
          if-no-files-found: error
          retention-days: 7
