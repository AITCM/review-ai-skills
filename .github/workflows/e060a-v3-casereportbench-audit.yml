name: E060A V3 Corrected CaseReportBench Audit
on:
  push:
    branches: ['data-tools/medcase-download-20261003']
    paths: ['.github/workflows/e060a-v3-casereportbench-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - run: curl -fsSL https://raw.githubusercontent.com/AITCM/review-ai-skills/data-tools/medcase-download-20261003/tools/e060a_v3_crb_audit.py -o run.py
      - run: python3 -m pip install --quiet pandas==2.2.3 pyarrow==20.0.0 numpy==2.2.6
      - name: Execute
        shell: bash
        run: |
          set -euo pipefail
          python3 -u run.py 2>&1 | tee E060A_V3.log
          test -s e060a-v3/E060A_V3_COMPATIBILITY_SUMMARY.json
          test -s e060a-v3/E060A_V3_CASE_AUDIT.csv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: E060A-V3-Corrected-Compatibility-Audit
          path: |
            e060a-v3/
            E060A_V3.log
          if-no-files-found: error
          retention-days: 14
