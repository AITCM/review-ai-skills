name: E050A PMC Patients Human Mapping Audit
on:
  push:
    branches: ['data-tools/medcase-download-20261003']
    paths: ['.github/workflows/e050a-pmc-human-mapping.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - run: curl -fsSL https://raw.githubusercontent.com/AITCM/review-ai-skills/data-tools/medcase-download-20261003/tools/e050a_pmc_mapping.py -o run.py
      - run: python3 -m pip install --quiet pandas==2.2.3 pyarrow==20.0.0 numpy==2.2.6 scikit-learn==1.6.1
      - name: Execute mapping-only audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -u run.py 2>&1 | tee E050A.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: E050A-PMC-Human-Mapping-Audit
          path: |
            e050-a-output/
            E050A.log
          retention-days: 14
