name: E031 Frozen External MedRBench Validation
on:
  push:
    branches: ['data-tools/medcase-download-20261003']
    paths: ['.github/workflows/e031-medr-external.yml']
permissions:
  contents: read
jobs:
  external:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - run: curl -fsSL https://raw.githubusercontent.com/AITCM/review-ai-skills/data-tools/medcase-download-20261003/tools/e031_medr_external.py -o run.py
      - run: python3 -m pip install --quiet pandas==2.2.3 pyarrow==20.0.0 numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1
      - name: Execute frozen external validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -u run.py 2>&1 | tee E031.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: E031-Frozen-MedRBench-External
          path: |
            e031-output/
            E031.log
          retention-days: 14
