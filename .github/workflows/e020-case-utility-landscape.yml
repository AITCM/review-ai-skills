name: E020-A Case Utility Landscape
on:
  push:
    branches: ['e020-case-utility-landscape']
    paths:
      - '.github/workflows/e020-case-utility-landscape.yml'
      - 'tools/e020_case_utility_landscape.py'
permissions:
  contents: read
concurrency:
  group: e020-case-utility-landscape
  cancel-in-progress: false
jobs:
  landscape:
    strategy:
      fail-fast: false
      matrix:
        backend: [lexical, neuml_pubmed, biomedbert_mean, bioclinicalbert_mean]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e020-case-utility-landscape
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1 pyarrow==20.0.0 huggingface_hub==0.34.4
          if [ "${{ matrix.backend }}" != "lexical" ]; then
            python -m pip install torch==2.7.1 transformers==4.55.4 sentence-transformers==5.1.0
          fi
      - name: Run fixed validation landscape
        shell: bash
        env:
          TOKENIZERS_PARALLELISM: 'false'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          mkdir -p output/${{ matrix.backend }}
          python tools/e020_case_utility_landscape.py \
            --backend "${{ matrix.backend }}" \
            --out "output/${{ matrix.backend }}" \
            --cache "cache/${{ matrix.backend }}" \
            --max-length 256
      - name: Preserve method-specific results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E020-A-${{ matrix.backend }}
          path: output/${{ matrix.backend }}/
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
